# Author: Jorge Pereira <jpereiran@gmail.com>
# Date: 2026-10-14
# Description: Build, verify, and publish macOS packages.

name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install qt cmake
      - name: Check version and architecture
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "$version"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build self-contained installer
        run: make osx-dmg
      - name: Check persistence and bundled plugins
        run: |
          ctest --test-dir build --output-on-failure
          GETRIGHT_APP_EXECUTABLE="build/package/GetRight Port.app/Contents/MacOS/GetRight Port" \
            python3 tests/persistence.py
          python3 tests/bundle.py
          codesign --verify --deep --strict "build/package/GetRight Port.app"
          hdiutil verify build/getright-port-macos-arm64.dmg
      - name: Create release packages
        run: |
          mkdir -p packages
          cp build/getright-port-macos-arm64.dmg "packages/getright-port-$VERSION-macos-arm64.dmg"
          ditto -c -k --sequesterRsrc --keepParent "build/package/GetRight Port.app" \
            "packages/getright-port-$VERSION-macos-arm64.zip"
          git archive --format=tar.gz --prefix="getright-port-$VERSION/" \
            -o "packages/getright-port-$VERSION-source.tar.gz" HEAD
          cd packages
          shasum -a 256 ./*.dmg ./*.zip ./*.tar.gz > SHA256SUMS.txt
      - name: Write release notes
        run: |
          qt_version=$("$(brew --prefix qt)/bin/qmake" -query QT_VERSION)
          cat > packages/release-notes.md <<EOF
          GetRight Port $VERSION for macOS 15 or later on Apple Silicon.

          Includes a self-contained DMG, an application ZIP, source code, and SHA-256 checksums.
          Built with Qt $qt_version, linked dynamically under LGPL v3.
          This independent study port uses reverse engineering, REA, and AI assistance.

          The app is ad-hoc signed and is not Apple-notarized, so macOS may refuse to open it.
          Download the DMG, open it, and copy GetRight Port to Applications. Then run:

              xattr -dr com.apple.quarantine "/Applications/GetRight Port.app"

          Or use System Settings > Privacy & Security > Open Anyway.

          Website: https://jpereira.github.io/getright/
          Source and build instructions: https://github.com/jpereira/getright
          Source commit: $GITHUB_SHA
          Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: getright-port-macos-arm64
          path: packages/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish packages
    if: startsWith(github.ref, 'refs/tags/')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: getright-port-macos-arm64
          path: packages
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "GetRight Port $RELEASE_TAG" \
              --notes-file packages/release-notes.md
            gh release upload "$RELEASE_TAG" --clobber \
              packages/*.dmg packages/*.zip packages/*.tar.gz packages/SHA256SUMS.txt
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "GetRight Port $RELEASE_TAG" \
              --notes-file packages/release-notes.md \
              packages/*.dmg packages/*.zip packages/*.tar.gz packages/SHA256SUMS.txt
          fi
      - name: Refresh website download list
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.2.3
      - name: Publish GitHub Packages
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$REGISTRY_TOKEN" | oras login ghcr.io -u "$REGISTRY_USER" --password-stdin
          cd packages
          oras push "$image:$RELEASE_TAG" \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.description=GetRight Port macOS packages" \
            --annotation "org.opencontainers.image.licenses=LGPL-3.0-only" \
            ./*.dmg ./*.zip ./*.tar.gz ./SHA256SUMS.txt
          oras tag "$image:$RELEASE_TAG" latest
